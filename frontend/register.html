<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - CivicTriage</title>
  <link rel="stylesheet" href="./src/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="font-sans antialiased bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 transition-colors duration-300 min-h-screen flex flex-col">
  
  <!-- Navigation -->
  <nav class="glass-nav py-4 px-6 w-full fixed top-0 z-50">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <a href="/index.html" class="flex items-center gap-2">
        <img alt="CivicTriage Logo" class="h-8 w-8 object-contain rounded-md bg-white p-1" src="/logo.png"/>
        <span class="font-bold text-xl tracking-tight text-slate-900 dark:text-white">CivicTriage</span>
      </a>
      <div class="flex items-center gap-4">
        <button id="theme-toggle" type="button" class="text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 focus:outline-none rounded-lg text-sm p-2.5">
          <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
          <svg id="theme-toggle-light-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path></svg>
        </button>
      </div>
    </div>
  </nav>

  <!-- Register Section -->
  <main class="flex-grow flex items-center justify-center pt-24 pb-12 px-4 w-full">
    <div class="glass-card w-full max-w-[448px]">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-slate-900 dark:text-white">Create an Account</h1>
        <p class="text-slate-600 dark:text-slate-400 mt-2">Join CivicTriage to report and track issues</p>
      </div>
      
      <form id="registerForm" class="space-y-5">
        <div>
          <label for="name" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Full Name</label>
          <input type="text" id="name" class="input-field" placeholder="John Doe" required>
        </div>

        <div>
          <label for="email" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Email Address</label>
          <input type="email" id="email" class="input-field" placeholder="you@example.com" required>
        </div>
        
        <div>
          <label for="password" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Password</label>
          <input type="password" id="password" class="input-field" placeholder="••••••••" required minlength="8">
        </div>

        <div>
          <label for="confirm-password" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Confirm Password</label>
          <input type="password" id="confirm-password" class="input-field" placeholder="••••••••" required minlength="8">
        </div>

        <div>
          <label for="role" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Account Type</label>
          <select id="role" class="input-field" required>
            <option value="citizen">Citizen</option>
            <option value="government">Government Official</option>
          </select>
        </div>
        
        <div class="flex items-start">
          <div class="flex items-center h-5">
            <input id="terms" type="checkbox" class="w-4 h-4 border border-gray-300 rounded bg-gray-50 focus:ring-3 focus:ring-primary-300 dark:bg-gray-700 dark:border-gray-600 dark:focus:ring-primary-600 dark:ring-offset-gray-800" required>
          </div>
          <label for="terms" class="ml-2 text-sm font-medium text-gray-900 dark:text-gray-300">I agree to the <a href="#" class="text-primary-600 hover:underline dark:text-primary-400">Terms and Conditions</a></label>
        </div>
        
        <button type="submit" id="submitBtn" class="w-full btn-primary py-3 text-lg">Register</button>
      </form>
      
      <p class="text-center mt-6 text-slate-600 dark:text-slate-400">
        Already have an account? <a href="/login.html" class="text-primary-600 dark:text-primary-400 font-semibold hover:underline">Sign in here</a>
      </p>
    </div>
  </main>

  <script type="module" src="./src/js/main.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const role = document.getElementById('role').value;
      const btn = document.getElementById('submitBtn');

      if (password !== confirmPassword) {
        if (window.showToast) window.showToast('Passwords do not match', 'error');
        else alert('Passwords do not match');
        return;
      }

      btn.disabled = true;
      btn.innerText = 'Registering...';

      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, full_name: name, role })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Registration failed');
        }

        if (window.showToast) window.showToast('Registration successful! Please login.', 'success');
        
        setTimeout(() => {
          window.location.href = '/login.html';
        }, 1500);

      } catch (err) {
        console.error(err);
        if (window.showToast) window.showToast(err.message, 'error');
        else alert(err.message);
        btn.disabled = false;
        btn.innerText = 'Register';
      }
    });
  </script>
</body>
</html>
